[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hhgoa-rag"
version = "0.1.0"
description = "Voice-enabled multilingual RAG system — HH Goa 2026 Task 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "pinecone==9.1.0",
    "httpx==0.28.1",
    "numpy==1.26.4",
    "datasets==3.2.0",
    "pyarrow==18.1.0",
    "websockets==14.1",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "unicodedata2==15.1.0",
    "langdetect==1.0.9",
    "pyyaml>=6.0",
    "transformers>=4.40.0,<5",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hhgoa_rag"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.13.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "pytest-cov==6.0.0",
    "hypothesis>=6.165.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
