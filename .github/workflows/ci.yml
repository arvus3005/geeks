name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # No managed vector DB anywhere in this project since 2026-08-22 (self-
  # hosted local hybrid index only) — MUST NEVER receive live provider
  # credentials other than what offline unit/behavioural/contract tests
  # need to exercise fail-closed dry-run paths.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy src scripts
      - name: Secret scanner (CI must contain no provider credentials)
        run: uv run python scripts/scan_secrets.py .
      - name: Offline tests (no live credentials)
        run: uv run pytest tests/unit/ tests/contract/ tests/behavioural/ -q -rs
        env:
          CORPUS_MODE: smoke
          # Writable HF cache so tokenizer tests do not silently skip.
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          SARVAM_API_KEY: ""
          ELEVENLABS_API_KEY: ""
